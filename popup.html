<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>inFilter</title>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 15px; width: 280px; color: #333; margin: 0; }
        h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #0a66c2; text-align: center; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .row label { font-weight: bold; font-size: 14px; }
        
        /* Toggle Switch CSS */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #057642; }
        input:checked + .slider:before { transform: translateX(18px); }

        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
        
        .fade-section { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #eaeaea; }
        .fade-section input[type="number"] { width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; font-size: 14px; }
        .help-text { font-size: 11px; color: #666; margin-top: 8px; line-height: 1.4; display: block; }
    </style>
</head>
<body>
    <h3>inFilter</h3>
    
    <div class="row">
        <label for="masterToggle">Enable Extension</label>
        <label class="switch">
            <input type="checkbox" id="masterToggle">
            <span class="slider"></span>
        </label>
    </div>

    <hr>

    <div class="fade-section">
        <div class="row" style="margin-bottom: 10px;">
            <label for="fadeToggle">Fade Small Companies</label>
            <label class="switch">
                <input type="checkbox" id="fadeToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="row" style="margin-bottom: 0;">
            <label for="fadeThreshold" style="font-weight: normal; font-size: 13px;">Minimum count:</label>
            <input type="number" id="fadeThreshold" placeholder="2000" min="0" step="100">
        </div>
        <span class="help-text">Job cards for companies under this threshold will be greyed out automatically.</span>
        
        <hr style="margin: 15px 0; border-top: 1px solid #eaeaea;">
        
        <div class="row" style="margin-bottom: 0px;">
            <label for="fadeUnknown">Fade Unknown Count (?)</label>
            <label class="switch">
                <input type="checkbox" id="fadeUnknown">
                <span class="slider"></span>
            </label>
        </div>
        
        <hr style="margin: 15px 0; border-top: 1px solid #eaeaea;">
        
        <div class="row" style="margin-bottom: 0px;">
            <label for="showSalaryIcon">Show Salary Search (💰)</label>
            <label class="switch">
                <input type="checkbox" id="showSalaryIcon">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>

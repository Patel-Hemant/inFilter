<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>inFilter</title>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 15px; width: 290px; color: #333; margin: 0; }
        h3 { margin-top: 0; margin-bottom: 12px; font-size: 16px; color: #0a66c2; text-align: center; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .row label { font-weight: bold; font-size: 13px; }
        
        /* Toggle Switch CSS */
        .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #057642; }
        input:checked + .slider:before { transform: translateX(18px); }

        hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
        
        .section-card { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #eaeaea; margin-bottom: 10px; }
        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; font-weight: 700; margin-bottom: 8px; display: block; }
        .section-card input[type="number"] { width: 75px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; font-size: 13px; }
        .help-text { font-size: 11px; color: #666; margin-top: 6px; line-height: 1.35; display: block; }
    </style>
</head>
<body>
    <h3>inFilter 💼</h3>
    
    <div class="row">
        <label for="masterToggle">Enable Extension</label>
        <label class="switch">
            <input type="checkbox" id="masterToggle">
            <span class="slider"></span>
        </label>
    </div>

    <!-- Company Scale Section -->
    <div class="section-card">
        <span class="section-title">🏢 Company Size Filter</span>
        <div class="row" style="margin-bottom: 8px;">
            <label for="fadeToggle" style="font-weight: normal; font-size: 13px;">Fade Small Companies</label>
            <label class="switch">
                <input type="checkbox" id="fadeToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="row" style="margin-bottom: 0;">
            <label for="fadeThreshold" style="font-weight: normal; font-size: 12px; color: #555;">Min Employees:</label>
            <input type="number" id="fadeThreshold" placeholder="2000" min="0" step="100">
        </div>
        
        <hr style="margin: 8px 0; border-top: 1px solid #eaeaea;">
        
        <div class="row" style="margin-bottom: 0;">
            <label for="fadeUnknown" style="font-weight: normal; font-size: 13px;">Fade Unknown Count (?)</label>
            <label class="switch">
                <input type="checkbox" id="fadeUnknown">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Experience / YOE Section -->
    <div class="section-card">
        <span class="section-title">🎓 Experience Filter (YOE)</span>
        <div class="row" style="margin-bottom: 8px;">
            <label for="showYoeBadge" style="font-weight: normal; font-size: 13px;">Show Experience (🎓)</label>
            <label class="switch">
                <input type="checkbox" id="showYoeBadge">
                <span class="slider"></span>
            </label>
        </div>
        <div class="row" style="margin-bottom: 8px;">
            <label for="fadeYoeEnabled" style="font-weight: normal; font-size: 13px;">Fade High YOE Jobs</label>
            <label class="switch">
                <input type="checkbox" id="fadeYoeEnabled">
                <span class="slider"></span>
            </label>
        </div>
        <div class="row" style="margin-bottom: 0;">
            <label for="maxYoeThreshold" style="font-weight: normal; font-size: 12px; color: #555;">My Max YOE (Years):</label>
            <input type="number" id="maxYoeThreshold" placeholder="3" min="0" max="30" step="1">
        </div>
        <span class="help-text">Fades jobs requiring more experience than you have (e.g. 5+ yrs if you have 3).</span>
    </div>

    <!-- Salary Intel Section -->
    <div class="section-card" style="margin-bottom: 0;">
        <span class="section-title">💰 Salary Intel</span>
        <div class="row" style="margin-bottom: 0;">
            <label for="showSalaryIcon" style="font-weight: normal; font-size: 13px;">Leetcode Search (💰)</label>
            <label class="switch">
                <input type="checkbox" id="showSalaryIcon">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
